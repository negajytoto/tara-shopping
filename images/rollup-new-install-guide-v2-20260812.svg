<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="650" viewBox="0 0 2400 650">
 <defs><linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8fafc"/><stop offset=".45" stop-color="#b9c6d5"/><stop offset="1" stop-color="#7f8da0"/></linearGradient><linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#326ed8"/><stop offset="1" stop-color="#173765"/></linearGradient></defs>
 <rect width="2400" height="650" rx="30" fill="#f5f8fd"/>
 <g font-family="Pretendard,'Noto Sans KR',Arial,sans-serif">
  <g transform="translate(45 35)"><rect width="540" height="580" rx="24" fill="#fff" stroke="#dce5f1" stroke-width="3"/><rect x="32" y="30" width="74" height="42" rx="10" fill="#326ed8"/><text x="69" y="59" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">STEP 1</text><text x="130" y="60" font-size="27" font-weight="800" fill="#172033">본체 배치</text><g transform="translate(75 155)"><rect x="20" y="118" width="350" height="72" rx="30" fill="url(#metal)" stroke="#6f7f98" stroke-width="3"/><rect x="35" y="135" width="320" height="18" rx="9" fill="#58677a"/><path d="M90 188l-42 58h95l30-58M300 188l-10 58h95l-25-58" fill="url(#metal)" stroke="#6f7f98" stroke-width="3"/></g><text x="270" y="472" text-anchor="middle" font-size="23" font-weight="700" fill="#172033">받침발을 펼쳐 바닥에 놓기</text><text x="270" y="515" text-anchor="middle" font-size="18" fill="#667085">본체가 흔들리지 않도록 수평을 맞춰 주세요.</text></g>
  <g transform="translate(635 35)"><rect width="540" height="580" rx="24" fill="#fff" stroke="#dce5f1" stroke-width="3"/><rect x="32" y="30" width="74" height="42" rx="10" fill="#326ed8"/><text x="69" y="59" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">STEP 2</text><text x="130" y="60" font-size="27" font-weight="800" fill="#172033">지지대 연결</text><g transform="translate(120 125)"><rect x="10" y="270" width="300" height="55" rx="24" fill="url(#metal)" stroke="#6f7f98" stroke-width="3"/><line x1="160" y1="45" x2="160" y2="285" stroke="#9aa8b9" stroke-width="18"/><circle cx="160" cy="275" r="17" fill="#326ed8"/><path d="M120 80h80" stroke="#173765" stroke-width="12" stroke-linecap="round"/><path d="M160 18v45" stroke="#326ed8" stroke-width="5"/><path d="M146 35l14-17 14 17" fill="none" stroke="#326ed8" stroke-width="5"/></g><text x="270" y="472" text-anchor="middle" font-size="23" font-weight="700" fill="#172033">지지대를 본체 홈에 연결하기</text><text x="270" y="515" text-anchor="middle" font-size="18" fill="#667085">연결부가 끝까지 들어갔는지 확인하세요.</text></g>
  <g transform="translate(1225 35)"><rect width="540" height="580" rx="24" fill="#fff" stroke="#dce5f1" stroke-width="3"/><rect x="32" y="30" width="74" height="42" rx="10" fill="#326ed8"/><text x="69" y="59" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">STEP 3</text><text x="130" y="60" font-size="27" font-weight="800" fill="#172033">배너 인출</text><g transform="translate(135 118)"><rect x="20" y="285" width="250" height="52" rx="23" fill="url(#metal)" stroke="#6f7f98" stroke-width="3"/><rect x="55" y="75" width="180" height="225" fill="url(#screen)"/><rect x="47" y="62" width="196" height="18" rx="9" fill="url(#metal)"/><path d="M145 52V5" stroke="#326ed8" stroke-width="5"/><path d="M131 24l14-19 14 19" fill="none" stroke="#326ed8" stroke-width="5"/></g><text x="270" y="472" text-anchor="middle" font-size="23" font-weight="700" fill="#172033">상단바를 잡고 천천히 올리기</text><text x="270" y="515" text-anchor="middle" font-size="18" fill="#667085">배너가 비틀리지 않게 수직으로 당겨 주세요.</text></g>
  <g transform="translate(1815 35)"><rect width="540" height="580" rx="24" fill="#fff" stroke="#dce5f1" stroke-width="3"/><rect x="32" y="30" width="74" height="42" rx="10" fill="#326ed8"/><text x="69" y="59" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">STEP 4</text><text x="130" y="60" font-size="27" font-weight="800" fill="#172033">상단 고정</text><g transform="translate(150 105)"><line x1="120" y1="35" x2="120" y2="355" stroke="#9aa8b9" stroke-width="13"/><rect x="25" y="45" width="190" height="275" fill="url(#screen)"/><rect x="15" y="30" width="210" height="18" rx="9" fill="url(#metal)"/><rect x="10" y="320" width="220" height="45" rx="20" fill="url(#metal)"/><circle cx="120" cy="40" r="13" fill="#326ed8"/></g><text x="270" y="472" text-anchor="middle" font-size="23" font-weight="700" fill="#172033">상단바를 지지대에 고정하기</text><text x="270" y="515" text-anchor="middle" font-size="18" fill="#667085">수직과 장력을 확인하면 설치가 완료됩니다.</text></g>
 </g>
</svg>
