<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550"><rect width="1200" height="550" fill="#fff"/>
<g font-family="Arial,sans-serif">
<text x="40" y="60" font-size="34" font-weight="800" fill="#142f3b">설치 방법</text>

<g transform="translate(25 105)">
<rect width="270" height="400" rx="18" fill="#fff" stroke="#dfe6e9"/>
<rect x="20" y="20" width="88" height="32" rx="15" fill="#0097a9"/><text x="64" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">STEP 01</text>
<rect x="50" y="210" width="170" height="28" rx="8" fill="#555"/>
<text x="20" y="300" font-size="20" font-weight="700" fill="#142f3b">본체를 놓습니다</text>
<text x="20" y="340" font-size="15" fill="#65747c">평평한 바닥에 본체를</text><text x="20" y="366" font-size="15" fill="#65747c">안정적으로 놓습니다.</text>
</g>
<g transform="translate(317 105)">
<rect width="270" height="400" rx="18" fill="#fff" stroke="#dfe6e9"/>
<rect x="20" y="20" width="88" height="32" rx="15" fill="#0097a9"/><text x="64" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">STEP 02</text>
<rect x="55" y="215" width="160" height="25" rx="7" fill="#555"/><line x1="135" y1="215" x2="135" y2="85" stroke="#777" stroke-width="9"/>
<text x="20" y="300" font-size="20" font-weight="700" fill="#142f3b">지지대를 연결합니다</text>
<text x="20" y="340" font-size="15" fill="#65747c">본체 뒤쪽에 폴대를</text><text x="20" y="366" font-size="15" fill="#65747c">순서대로 연결합니다.</text>
</g>
<g transform="translate(609 105)">
<rect width="270" height="400" rx="18" fill="#fff" stroke="#dfe6e9"/>
<rect x="20" y="20" width="88" height="32" rx="15" fill="#0097a9"/><text x="64" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">STEP 03</text>
<rect x="65" y="85" width="140" height="155" fill="#5847dc"/><rect x="50" y="240" width="170" height="25" rx="7" fill="#555"/>
<text x="20" y="300" font-size="20" font-weight="700" fill="#142f3b">출력물을 올립니다</text>
<text x="20" y="340" font-size="15" fill="#65747c">상단 바를 잡고 천천히</text><text x="20" y="366" font-size="15" fill="#65747c">위쪽으로 당겨 올립니다.</text>
</g>
<g transform="translate(901 105)">
<rect width="270" height="400" rx="18" fill="#fff" stroke="#dfe6e9"/>
<rect x="20" y="20" width="88" height="32" rx="15" fill="#0097a9"/><text x="64" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">STEP 04</text>
<rect x="65" y="75" width="140" height="180" fill="#5847dc"/><rect x="50" y="255" width="170" height="25" rx="7" fill="#555"/><line x1="210" y1="75" x2="210" y2="255" stroke="#777" stroke-width="8"/>
<text x="20" y="300" font-size="20" font-weight="700" fill="#142f3b">상단을 고정합니다</text>
<text x="20" y="340" font-size="15" fill="#65747c">상단 바를 폴대에 걸어</text><text x="20" y="366" font-size="15" fill="#65747c">수직 상태를 확인합니다.</text>
</g></g></svg>