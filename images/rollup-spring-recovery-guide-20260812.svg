<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="620" viewBox="0 0 2400 620"><defs><radialGradient id="case"><stop stop-color="#4b5563"/><stop offset=".65" stop-color="#222b38"/><stop offset="1" stop-color="#111827"/></radialGradient></defs><rect width="2400" height="620" rx="30" fill="#fff8e8"/><g font-family="Pretendard,'Noto Sans KR',Arial,sans-serif"><text x="85" y="82" font-size="34" font-weight="900" fill="#172033">롤업배너 스프링이 풀렸을 때</text><rect x="85" y="108" width="520" height="6" fill="#ff5353"/><text x="85" y="170" font-size="23" fill="#5f4a16">화면 위치를 조정할 때는 말려 들어가지 않도록 상단 레일을 반드시 잡아주세요.</text><text x="85" y="215" font-size="23" fill="#5f4a16">본체 좌측 레버를 LOCK으로 돌린 뒤 손잡이를 이용해 장력을 복원합니다.</text><rect x="85" y="270" width="1160" height="250" rx="22" fill="#ffffff" stroke="#ead8a8" stroke-width="3"/><text x="125" y="325" font-size="24" font-weight="800" fill="#172033">장력 복원 순서</text><text x="125" y="380" font-size="21" fill="#475569">1. 화면을 잡고 좌측 레버를 LOCK 방향으로 돌립니다.</text><text x="125" y="425" font-size="21" fill="#475569">2. 전용 손잡이를 결합해 시계 방향으로 천천히 돌립니다.</text><text x="125" y="470" font-size="21" fill="#475569">3. 화면이 자연스럽게 감기는 장력이 생기면 손잡이를 분리합니다.</text><g transform="translate(1450 80)"><path d="M120 385L40 460 55 315z" fill="url(#case)"/><path d="M105 85C300 5 560 35 690 205l-35 255H140C65 360 55 190 105 85z" fill="url(#case)"/><circle cx="390" cy="275" r="145" fill="#111827" stroke="#687385" stroke-width="18"/><circle cx="390" cy="275" r="72" fill="#353f4d" stroke="#9aa8b9" stroke-width="12"/><rect x="345" y="230" width="90" height="90" rx="18" fill="#111827"/><path d="M545 178c55 70 52 155-10 220" fill="none" stroke="#ff5353" stroke-width="14"/><path d="M512 376l23 22 25-24" fill="none" stroke="#ff5353" stroke-width="14"/><text x="390" y="535" text-anchor="middle" font-size="25" font-weight="800" fill="#ff5353">시계 방향</text></g></g></svg>
