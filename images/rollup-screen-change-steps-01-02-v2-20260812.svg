<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<defs><linearGradient id="m" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".5" stop-color="#c8d2de"/><stop offset="1" stop-color="#7e8b9c"/></linearGradient><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#326ed8"/><stop offset="1" stop-color="#173765"/></linearGradient></defs>
<rect width="2400" height="980" rx="32" fill="#f5f8fd"/><g font-family="Pretendard,'Noto Sans KR',Arial,sans-serif">
<g transform="translate(40 35)"><rect width="550" height="650" rx="24" fill="#fff" stroke="#dce5f1" stroke-width="3"/><rect x="30" y="28" width="70" height="42" rx="9" fill="#173765"/><text x="65" y="58" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">01</text><text x="122" y="59" font-size="27" font-weight="800" fill="#172033">기존 화면 고정</text><g transform="translate(145 105)"><rect x="15" y="320" width="230" height="54" rx="24" fill="url(#m)" stroke="#6f7f98" stroke-width="3"/><rect x="50" y="52" width="160" height="280" fill="url(#b)"/><rect x="37" y="35" width="186" height="19" rx="9" fill="url(#m)"/><path d="M230 320h55v55h-55z" fill="#ffcd57" stroke="#946700" stroke-width="3"/><path d="M242 347h30" stroke="#946700" stroke-width="5"/></g><text x="275" y="510" text-anchor="middle" font-size="22" font-weight="800" fill="#172033">화면을 최대 높이로 올려 고정하세요</text><text x="275" y="550" text-anchor="middle" font-size="17" fill="#667085">화면이 본체로 감기지 않도록 잡아줍니다.</text></g>
<g transform="translate(630 35)"><rect width="550" height="650" rx="24" fill="#fff" stroke="#dce5f1" stroke-width="3"/><rect x="30" y="28" width="70" height="42" rx="9" fill="#173765"/><text x="65" y="58" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">02</text><text x="122" y="59" font-size="27" font-weight="800" fill="#172033">잠금 레버 고정</text><g transform="translate(110 135)"><ellipse cx="165" cy="165" rx="145" ry="145" fill="#172033"/><rect x="105" y="112" width="120" height="102" rx="18" fill="#526174"/><rect x="125" y="132" width="80" height="62" rx="10" fill="#111827"/><path d="M238 108v118" stroke="#ff5353" stroke-width="8"/><path d="M218 132l20-24 20 24" fill="none" stroke="#ff5353" stroke-width="7"/><text x="165" y="265" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">LOCK</text></g><text x="275" y="510" text-anchor="middle" font-size="22" font-weight="800" fill="#172033">양쪽 레버를 LOCK 방향으로 고정하세요</text><text x="275" y="550" text-anchor="middle" font-size="17" fill="#667085">본체 좌우의 잠금 상태를 모두 확인합니다.</text></g>
<g transform="translate(1220 35)"><rect width="550" height="650" rx="24" fill="#fff" stroke="#dce5f1" stroke-width="3"/><rect x="30" y="28" width="70" height="42" rx="9" fill="#173765"/><text x="65" y="58" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">03</text><text x="122" y="59" font-size="27" font-weight="800" fill="#172033">지지대 분리</text><g transform="translate(145 105)"><rect x="20" y="325" width="220" height="50" rx="22" fill="url(#m)"/><rect x="50" y="65" width="160" height="270" fill="#e8eef7"/><line x1="130" y1="35" x2="130" y2="345" stroke="#9aa8b9" stroke-width="14"/><path d="M245 150c55 35 55 100 0 135" fill="none" stroke="#326ed8" stroke-width="6"/><path d="M260 263l-15 22-22-15" fill="none" stroke="#326ed8" stroke-width="6"/></g><text x="275" y="510" text-anchor="middle" font-size="22" font-weight="800" fill="#172033">상단 레일에서 지지대를 분리하세요</text><text x="275" y="550" text-anchor="middle" font-size="17" fill="#667085">화면을 잡은 상태에서 지지대를 접어둡니다.</text></g>
<g transform="translate(1810 35)"><rect width="550" height="650" rx="24" fill="#fff" stroke="#dce5f1" stroke-width="3"/><rect x="30" y="28" width="70" height="42" rx="9" fill="#173765"/><text x="65" y="58" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">04</text><text x="122" y="59" font-size="27" font-weight="800" fill="#172033">화면 끝까지 인출</text><g transform="translate(125 105)"><rect x="10" y="325" width="300" height="55" rx="24" fill="url(#m)"/><rect x="50" y="40" width="220" height="300" fill="#e8eef7"/><path d="M285 60v240" stroke="#326ed8" stroke-width="6" stroke-dasharray="14 10"/><path d="M268 82l17-22 17 22" fill="none" stroke="#326ed8" stroke-width="6"/><path d="M15 45c38-28 70-25 103 5" fill="none" stroke="#e6b391" stroke-width="28" stroke-linecap="round"/></g><text x="275" y="510" text-anchor="middle" font-size="22" font-weight="800" fill="#172033">하단 연결부가 보일 때까지 당기세요</text><text x="275" y="550" text-anchor="middle" font-size="17" fill="#667085">본체 안쪽의 연결면을 완전히 노출합니다.</text></g>
<g transform="translate(630 715)"><rect width="1140" height="225" rx="24" fill="#173765"/><rect x="34" y="28" width="70" height="42" rx="9" fill="#326ed8"/><text x="69" y="58" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">05</text><text x="130" y="59" font-size="27" font-weight="800" fill="#fff">새 화면 교체 후 천천히 수납</text><g transform="translate(720 28)"><rect x="20" y="125" width="300" height="48" rx="21" fill="url(#m)"/><rect x="70" y="15" width="200" height="125" fill="url(#b)"/><path d="M330 28v125" stroke="#8fb7ff" stroke-width="6"/><path d="M313 130l17 23 17-23" fill="none" stroke="#8fb7ff" stroke-width="6"/></g><text x="55" y="115" font-size="22" font-weight="700" fill="#fff">기존 출력물을 분리하고 새 출력물의 하단을 연결부에 맞춰 부착합니다.</text><text x="55" y="157" font-size="18" fill="#dbe7fb">좌우 레버를 해제한 뒤 상단 레일을 잡고 화면이 비틀리지 않게 본체 안으로 천천히 넣어주세요.</text></g>
</g></svg>
