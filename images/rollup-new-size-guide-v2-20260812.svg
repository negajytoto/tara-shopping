<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" rx="28" fill="#f5f8fd"/>
  <text x="600" y="68" text-anchor="middle" font-family="Pretendard,'Noto Sans KR',Arial,sans-serif" font-size="32" font-weight="800" fill="#172033">롤업배너 규격 안내</text>
  <text x="600" y="104" text-anchor="middle" font-family="Pretendard,'Noto Sans KR',Arial,sans-serif" font-size="17" fill="#667085">설치 공간과 노출 범위에 맞춰 가로 폭과 세로 길이를 선택하세요</text>

  <rect x="54" y="138" width="1092" height="92" rx="16" fill="#ffffff" stroke="#dce5f1"/>
  <text x="88" y="174" font-family="Pretendard,'Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="700" fill="#667085">설치 장소</text>
  <rect x="285" y="161" width="24" height="24" rx="3" fill="#326ed8"/><path d="M291 173l5 5 10-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="323" y="180" font-family="Pretendard,'Noto Sans KR',Arial,sans-serif" font-size="20" font-weight="800" fill="#326ed8">실내용</text>
  <rect x="510" y="161" width="24" height="24" rx="3" fill="#ffffff" stroke="#8a94a6" stroke-width="3"/>
  <text x="548" y="180" font-family="Pretendard,'Noto Sans KR',Arial,sans-serif" font-size="20" fill="#667085">실외용</text>
  <text x="730" y="180" font-family="Pretendard,'Noto Sans KR',Arial,sans-serif" font-size="15" fill="#667085">바람이 강한 환경에서는 사용을 권장하지 않습니다.</text>

  <rect x="54" y="244" width="1092" height="92" rx="16" fill="#ffffff" stroke="#dce5f1"/>
  <text x="88" y="280" font-family="Pretendard,'Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="700" fill="#667085">배너 방향</text>
  <rect x="285" y="267" width="24" height="24" rx="3" fill="#326ed8"/><path d="M291 279l5 5 10-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="323" y="286" font-family="Pretendard,'Noto Sans KR',Arial,sans-serif" font-size="20" font-weight="800" fill="#326ed8">단면</text>
  <rect x="510" y="267" width="24" height="24" rx="3" fill="#ffffff" stroke="#8a94a6" stroke-width="3"/>
  <text x="548" y="286" font-family="Pretendard,'Noto Sans KR',Arial,sans-serif" font-size="20" fill="#667085">양면</text>
  <text x="730" y="286" font-family="Pretendard,'Noto Sans KR',Arial,sans-serif" font-size="15" fill="#667085">전면 한 방향으로 메시지를 노출하는 구조입니다.</text>

  <rect x="54" y="350" width="1092" height="92" rx="16" fill="#ffffff" stroke="#dce5f1"/>
  <text x="88" y="386" font-family="Pretendard,'Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="700" fill="#667085">사이즈</text>
  <rect x="285" y="373" width="24" height="24" rx="3" fill="#326ed8"/><path d="M291 385l5 5 10-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="323" y="392" font-family="Pretendard,'Noto Sans KR',Arial,sans-serif" font-size="20" font-weight="800" fill="#326ed8">사이즈 조절 가능</text>
  <text x="590" y="392" font-family="Pretendard,'Noto Sans KR',Arial,sans-serif" font-size="16" fill="#667085">가로 5종 · 세로 1000~2400mm</text>

  <rect x="54" y="456" width="1092" height="162" rx="16" fill="#173765"/>
  <text x="88" y="496" font-family="Pretendard,'Noto Sans KR',Arial,sans-serif" font-size="17" font-weight="700" fill="#9ec2ff">출력 규격</text>
  <g font-family="Pretendard,'Noto Sans KR',Arial,sans-serif" text-anchor="middle">
    <rect x="235" y="482" width="156" height="102" rx="14" fill="#244b82"/><text x="313" y="520" font-size="21" font-weight="800" fill="#ffffff">ROLL-UP 60</text><text x="313" y="552" font-size="16" fill="#dbe7fb">600 × 1000~2400</text>
    <rect x="405" y="482" width="156" height="102" rx="14" fill="#244b82"/><text x="483" y="520" font-size="21" font-weight="800" fill="#ffffff">ROLL-UP 85</text><text x="483" y="552" font-size="16" fill="#dbe7fb">850 × 1000~2400</text>
    <rect x="575" y="482" width="156" height="102" rx="14" fill="#326ed8"/><text x="653" y="520" font-size="21" font-weight="800" fill="#ffffff">ROLL-UP 100</text><text x="653" y="552" font-size="16" fill="#ffffff">1000 × 1000~2400</text>
    <rect x="745" y="482" width="156" height="102" rx="14" fill="#244b82"/><text x="823" y="520" font-size="21" font-weight="800" fill="#ffffff">ROLL-UP 120</text><text x="823" y="552" font-size="16" fill="#dbe7fb">1200 × 1000~2400</text>
    <rect x="915" y="482" width="156" height="102" rx="14" fill="#244b82"/><text x="993" y="520" font-size="21" font-weight="800" fill="#ffffff">ROLL-UP 150</text><text x="993" y="552" font-size="16" fill="#dbe7fb">1500 × 1000~2400</text>
  </g>
  <text x="600" y="650" text-anchor="middle" font-family="Pretendard,'Noto Sans KR',Arial,sans-serif" font-size="14" fill="#667085">단위 mm · 선택 가능한 세부 규격은 주문 옵션을 확인해 주세요.</text>
</svg>
