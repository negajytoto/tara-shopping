<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <rect width="1200" height="820" fill="#ffffff"/>
  <rect x="42" y="38" width="1116" height="744" rx="24" fill="#ffffff" stroke="#d8e2f0"/>
  <text x="600" y="112" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="34" font-weight="800" fill="#172033">미니배너 디자인 작업 가이드</text>
  <text x="600" y="150" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="17" fill="#667085">완성 사이즈 180 × 420mm · 사방 아일렛 4개</text>

  <rect x="110" y="182" width="455" height="435" rx="24" fill="#f5f8fd" stroke="#d8e2f0"/>
  <text x="138" y="222" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="20" font-weight="800" fill="#172033">작업 영역과 안전 영역</text>
  <rect x="278" y="252" width="144" height="336" fill="#e9f2ff" stroke="#ff5353" stroke-width="4"/>
  <rect x="278" y="252" width="144" height="336" fill="none" stroke="#2f75e8" stroke-width="3" stroke-dasharray="8 6"/>
  <rect x="286" y="260" width="128" height="320" fill="none" stroke="#6f7f98" stroke-width="2" stroke-dasharray="6 5"/>
  <circle cx="286" cy="260" r="7" fill="#8a94a6"/><circle cx="414" cy="260" r="7" fill="#8a94a6"/>
  <circle cx="286" cy="580" r="7" fill="#8a94a6"/><circle cx="414" cy="580" r="7" fill="#8a94a6"/>
  <line x1="250" y1="252" x2="250" y2="588" stroke="#172033" stroke-width="1.7"/>
  <line x1="242" y1="252" x2="258" y2="252" stroke="#172033" stroke-width="1.7"/>
  <line x1="242" y1="588" x2="258" y2="588" stroke="#172033" stroke-width="1.7"/>
  <text x="229" y="420" text-anchor="middle" transform="rotate(-90 229 420)" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="15" fill="#172033">420mm</text>
  <line x1="278" y1="608" x2="422" y2="608" stroke="#172033" stroke-width="1.7"/>
  <line x1="278" y1="600" x2="278" y2="616" stroke="#172033" stroke-width="1.7"/>
  <line x1="422" y1="600" x2="422" y2="616" stroke="#172033" stroke-width="1.7"/>
  <text x="350" y="638" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="15" fill="#172033">180mm</text>
  <text x="350" y="410" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="21" font-weight="800" fill="#2767d8">180 × 420mm</text>
  <text x="350" y="440" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="14" fill="#667085">세로형 3 : 7 비율</text>

  <rect x="595" y="182" width="495" height="435" rx="24" fill="#ffffff" stroke="#d8e2f0"/>
  <text x="625" y="222" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="20" font-weight="800" fill="#172033">영역별 작업 기준</text>
  <rect x="625" y="252" width="52" height="72" fill="#ffffff" stroke="#ff5353" stroke-width="2"/>
  <text x="704" y="272" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="18" font-weight="800" fill="#ff4545">재단 영역 180 × 420mm</text>
  <text x="704" y="298" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="14" fill="#667085">실제 완성 사이즈입니다.</text>
  <text x="704" y="319" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="14" fill="#667085">디자인 파일에 별도의 재단선을 표시하지 마세요.</text>

  <rect x="625" y="342" width="52" height="72" fill="#e9f2ff" stroke="#2f75e8" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="704" y="362" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="18" font-weight="800" fill="#2767d8">작업 영역 180 × 420mm</text>
  <text x="704" y="390" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="14" fill="#667085">배경 이미지와 색상은 완성 사이즈 끝까지 채워 주세요.</text>

  <rect x="625" y="432" width="52" height="72" fill="#ffffff" stroke="#6f7f98" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="704" y="452" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="18" font-weight="800" fill="#172033">안전 영역 160 × 400mm</text>
  <text x="704" y="480" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="14" fill="#667085">중요 문구와 로고는 사방 10mm 안쪽에 배치해 주세요.</text>

  <circle cx="651" cy="551" r="29" fill="#e9f2ff" stroke="#2f75e8" stroke-width="2"/>
  <circle cx="651" cy="551" r="11" fill="none" stroke="#8a94a6" stroke-width="6"/>
  <line x1="651" y1="515" x2="651" y2="528" stroke="#6f7f98" stroke-width="1.5"/>
  <line x1="615" y1="551" x2="628" y2="551" stroke="#6f7f98" stroke-width="1.5"/>
  <text x="704" y="540" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="18" font-weight="800" fill="#172033">아일렛 가공</text>
  <text x="704" y="565" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="14" fill="#667085">네 모서리에 아일렛이 자동 가공됩니다.</text>
  <text x="704" y="586" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="14" fill="#667085">디자인 파일에 아일렛 위치를 표시하지 마세요.</text>

  <rect x="110" y="650" width="980" height="82" rx="18" fill="#173765"/>
  <text x="600" y="683" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff">파일 작업 시 꼭 확인해 주세요</text>
  <text x="600" y="711" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="14" fill="#dbe7fb">재단선과 아일렛 위치는 자동 적용됩니다. 디자인 파일에 표시하면 인쇄면에 그대로 출력될 수 있습니다.</text>
</svg>
