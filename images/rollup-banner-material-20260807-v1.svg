<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530"><rect width="1200" height="530" fill="#fff"/>
<g font-family="Arial,sans-serif">
<text x="40" y="65" font-size="34" font-weight="800" fill="#142f3b">출력 소재 안내</text>
<text x="40" y="105" font-size="18" fill="#65747c">롤업배너는 말림과 반복 전개를 고려해 적합한 출력 소재를 선택합니다.</text>
<rect x="40" y="150" width="1120" height="62" fill="#f2f5f7" stroke="#dfe6e9"/>
<text x="70" y="190" font-size="18" font-weight="700" fill="#142f3b">소재</text><text x="330" y="190" font-size="18" font-weight="700" fill="#142f3b">특징</text><text x="830" y="190" font-size="18" font-weight="700" fill="#142f3b">추천</text>

<g transform="translate(40 212)"><rect width="1120" height="90" fill="#fff" stroke="#dfe6e9"/>
<text x="30" y="54" font-size="19" font-weight="700" fill="#142f3b">PET</text>
<text x="290" y="42" font-size="16" fill="#65747c">탄탄한 표면과 선명한 발색</text><text x="290" y="68" font-size="16" fill="#65747c">말림 후에도 형태 유지에 유리</text>
<text x="790" y="54" font-size="16" fill="#65747c">일반 롤업배너</text></g>
<g transform="translate(40 302)"><rect width="1120" height="90" fill="#fff" stroke="#dfe6e9"/>
<text x="30" y="54" font-size="19" font-weight="700" fill="#142f3b">합성지</text>
<text x="290" y="42" font-size="16" fill="#65747c">유연하고 가벼운 소재</text><text x="290" y="68" font-size="16" fill="#65747c">실내 안내·행사 출력에 활용</text>
<text x="790" y="54" font-size="16" fill="#65747c">단기 행사·안내</text></g>
<g transform="translate(40 392)"><rect width="1120" height="90" fill="#fff" stroke="#dfe6e9"/>
<text x="30" y="54" font-size="19" font-weight="700" fill="#142f3b">블록아웃 계열</text>
<text x="290" y="42" font-size="16" fill="#65747c">후면 빛 비침을 줄이는 구성</text><text x="290" y="68" font-size="16" fill="#65747c">조명이 있는 공간에서 안정적 표현</text>
<text x="790" y="54" font-size="16" fill="#65747c">전시·매장</text></g></g></svg>