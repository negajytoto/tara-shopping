<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="600" y="72" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="35" font-weight="800" fill="#172033">엑스배너 디자인 작업 가이드</text>
  <text x="600" y="108" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="17" fill="#667085">완성 사이즈 600 × 1800mm · 사방 아일렛 4개</text>

  <rect x="55" y="145" width="500" height="500" rx="22" fill="#f5f8fd" stroke="#dfe7f2"/>
  <text x="85" y="187" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="20" font-weight="800" fill="#172033">작업 영역과 안전 영역</text>

  <rect x="215" y="220" width="180" height="360" fill="#ffffff" stroke="#ff5d5d" stroke-width="3"/>
  <rect x="227" y="232" width="156" height="336" fill="#eaf2ff" stroke="#2e78e6" stroke-width="2" stroke-dasharray="7 6"/>
  <rect x="239" y="244" width="132" height="312" fill="none" stroke="#687386" stroke-width="2" stroke-dasharray="5 5"/>

  <circle cx="235" cy="240" r="7" fill="#8a94a6"/><circle cx="375" cy="240" r="7" fill="#8a94a6"/>
  <circle cx="235" cy="560" r="7" fill="#8a94a6"/><circle cx="375" cy="560" r="7" fill="#8a94a6"/>
  <text x="305" y="390" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="19" font-weight="800" fill="#245fca">600 × 1800mm</text>
  <text x="305" y="418" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="14" fill="#667085">세로형 1 : 3 비율</text>

  <line x1="215" y1="602" x2="395" y2="602" stroke="#172033" stroke-width="1.5"/>
  <line x1="215" y1="594" x2="215" y2="610" stroke="#172033" stroke-width="1.5"/>
  <line x1="395" y1="594" x2="395" y2="610" stroke="#172033" stroke-width="1.5"/>
  <text x="305" y="628" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="15" fill="#172033">600mm</text>
  <line x1="185" y1="220" x2="185" y2="580" stroke="#172033" stroke-width="1.5"/>
  <line x1="177" y1="220" x2="193" y2="220" stroke="#172033" stroke-width="1.5"/>
  <line x1="177" y1="580" x2="193" y2="580" stroke="#172033" stroke-width="1.5"/>
  <text x="163" y="405" text-anchor="middle" transform="rotate(-90 163 405)" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="15" fill="#172033">1800mm</text>

  <rect x="590" y="145" width="555" height="500" rx="22" fill="#ffffff" stroke="#dfe7f2"/>
  <text x="625" y="187" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="20" font-weight="800" fill="#172033">영역별 작업 기준</text>

  <rect x="625" y="220" width="56" height="82" fill="#ffffff" stroke="#ff5d5d" stroke-width="2"/>
  <text x="710" y="244" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="18" font-weight="800" fill="#ff4d4d">재단 영역 600 × 1800mm</text>
  <text x="710" y="273" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="14" fill="#5f6b7d">실제 완성 사이즈입니다.</text>
  <text x="710" y="294" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="14" fill="#5f6b7d">디자인 파일에 별도의 재단선을 표시하지 마세요.</text>

  <rect x="625" y="330" width="56" height="82" fill="#eaf2ff" stroke="#2e78e6" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="710" y="354" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="18" font-weight="800" fill="#2e78e6">작업 영역 600 × 1800mm</text>
  <text x="710" y="383" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="14" fill="#5f6b7d">배경 이미지와 색상은 완성 사이즈 끝까지 채워 주세요.</text>

  <rect x="625" y="440" width="56" height="82" fill="#ffffff" stroke="#687386" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="710" y="464" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="18" font-weight="800" fill="#303948">안전 영역 560 × 1760mm</text>
  <text x="710" y="493" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="14" fill="#5f6b7d">중요 문구와 로고는 사방 20mm 안쪽에 배치해 주세요.</text>

  <circle cx="653" cy="570" r="34" fill="#eef4ff" stroke="#2e78e6" stroke-width="2"/>
  <circle cx="653" cy="570" r="11" fill="#ffffff" stroke="#8a94a6" stroke-width="5"/>
  <line x1="653" y1="529" x2="653" y2="545" stroke="#172033"/>
  <line x1="612" y1="570" x2="628" y2="570" stroke="#172033"/>
  <text x="710" y="557" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="18" font-weight="800" fill="#172033">아일렛 가공</text>
  <text x="710" y="584" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="14" fill="#5f6b7d">네 모서리에 아일렛이 자동 가공됩니다.</text>
  <text x="710" y="606" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="14" fill="#5f6b7d">디자인 파일에 아일렛 위치를 표시하지 마세요.</text>

  <rect x="55" y="680" width="1090" height="92" rx="16" fill="#102a54"/>
  <text x="600" y="718" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff">파일 작업 시 꼭 확인해 주세요</text>
  <text x="600" y="750" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="15" fill="#d7e4f7">재단선과 아일렛 위치는 자동 적용됩니다. 디자인 파일에 표시할 경우 인쇄면에 그대로 출력될 수 있습니다.</text>
</svg>
