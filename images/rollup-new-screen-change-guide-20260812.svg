<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="650" viewBox="0 0 2400 650">
 <defs><linearGradient id="m" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8fafc"/><stop offset=".5" stop-color="#b8c5d4"/><stop offset="1" stop-color="#7c8b9e"/></linearGradient><linearGradient id="old" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8a94a6"/><stop offset="1" stop-color="#4b5565"/></linearGradient><linearGradient id="new" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3f7bea"/><stop offset="1" stop-color="#173765"/></linearGradient></defs>
 <rect width="2400" height="650" rx="30" fill="#f5f8fd"/>
 <g font-family="Pretendard,'Noto Sans KR',Arial,sans-serif">
  <g transform="translate(45 35)"><rect width="540" height="580" rx="24" fill="#fff" stroke="#dce5f1" stroke-width="3"/><rect x="32" y="30" width="74" height="42" rx="10" fill="#173765"/><text x="69" y="59" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">STEP 1</text><text x="130" y="60" font-size="27" font-weight="800" fill="#172033">기존 화면 고정</text><g transform="translate(140 115)"><rect x="15" y="285" width="230" height="55" rx="25" fill="url(#m)" stroke="#6f7f98" stroke-width="3"/><rect x="45" y="55" width="170" height="245" fill="url(#old)"/><path d="M232 292h55v55h-55z" fill="#ffcd57" stroke="#9a6b00" stroke-width="3"/><path d="M245 319h29" stroke="#9a6b00" stroke-width="5"/></g><text x="270" y="472" text-anchor="middle" font-size="23" font-weight="700" fill="#172033">안전핀으로 화면을 고정하기</text><text x="270" y="515" text-anchor="middle" font-size="18" fill="#667085">화면이 본체로 감기지 않도록 먼저 고정하세요.</text></g>
  <g transform="translate(635 35)"><rect width="540" height="580" rx="24" fill="#fff" stroke="#dce5f1" stroke-width="3"/><rect x="32" y="30" width="74" height="42" rx="10" fill="#173765"/><text x="69" y="59" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">STEP 2</text><text x="130" y="60" font-size="27" font-weight="800" fill="#172033">상단바 분리</text><g transform="translate(125 125)"><rect x="55" y="65" width="190" height="240" fill="url(#old)"/><rect x="35" y="42" width="230" height="22" rx="10" fill="url(#m)"/><path d="M275 53h55" stroke="#326ed8" stroke-width="6"/><path d="M309 37l21 16-21 16" fill="none" stroke="#326ed8" stroke-width="6"/><circle cx="50" cy="53" r="22" fill="#eaf2ff" stroke="#326ed8" stroke-width="3"/></g><text x="270" y="472" text-anchor="middle" font-size="23" font-weight="700" fill="#172033">상단 고정바에서 화면 분리하기</text><text x="270" y="515" text-anchor="middle" font-size="18" fill="#667085">클립이나 레일 구조를 손상 없이 분리하세요.</text></g>
  <g transform="translate(1225 35)"><rect width="540" height="580" rx="24" fill="#fff" stroke="#dce5f1" stroke-width="3"/><rect x="32" y="30" width="74" height="42" rx="10" fill="#173765"/><text x="69" y="59" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">STEP 3</text><text x="130" y="60" font-size="27" font-weight="800" fill="#172033">하단 연결부 분리</text><g transform="translate(105 138)"><rect x="20" y="250" width="310" height="62" rx="28" fill="url(#m)" stroke="#6f7f98" stroke-width="3"/><rect x="90" y="30" width="170" height="235" fill="url(#old)"/><rect x="80" y="247" width="190" height="24" rx="8" fill="#ffcd57"/><path d="M275 258h60" stroke="#326ed8" stroke-width="6"/><path d="M314 242l21 16-21 16" fill="none" stroke="#326ed8" stroke-width="6"/></g><text x="270" y="472" text-anchor="middle" font-size="23" font-weight="700" fill="#172033">본체 연결 레일에서 화면 분리하기</text><text x="270" y="515" text-anchor="middle" font-size="18" fill="#667085">고정 테이프와 연결부 상태를 확인해 주세요.</text></g>
  <g transform="translate(1815 35)"><rect width="540" height="580" rx="24" fill="#fff" stroke="#dce5f1" stroke-width="3"/><rect x="32" y="30" width="74" height="42" rx="10" fill="#173765"/><text x="69" y="59" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">STEP 4</text><text x="130" y="60" font-size="27" font-weight="800" fill="#172033">새 화면 결합</text><g transform="translate(135 105)"><rect x="18" y="300" width="234" height="55" rx="25" fill="url(#m)" stroke="#6f7f98" stroke-width="3"/><rect x="50" y="42" width="170" height="273" fill="url(#new)"/><rect x="40" y="28" width="190" height="18" rx="9" fill="url(#m)"/><circle cx="135" cy="180" r="38" fill="#fff" opacity=".9"/><path d="M116 181l13 13 27-31" fill="none" stroke="#326ed8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="270" y="472" text-anchor="middle" font-size="23" font-weight="700" fill="#172033">새 화면을 위·아래 연결부에 결합하기</text><text x="270" y="515" text-anchor="middle" font-size="18" fill="#667085">안전핀을 제거하고 천천히 수납해 완료합니다.</text></g>
 </g>
</svg>
