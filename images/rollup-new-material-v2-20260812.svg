  <g font-family="Pretendard,'Noto Sans KR',Arial,sans-serif" font-size="34" fill="#334155">
    <text x="760" y="267"><tspan x="760" dy="0">발색이 우수하고 내구성이 뛰어나</tspan><tspan x="760" dy="58">선명한 이미지 표현에 적합합니다.</tspan></text>
    <text x="760" y="505"><tspan x="760" dy="0">가성비가 좋고 색 표현이 선명하여</tspan><tspan x="760" dy="58">일반적인 실내 홍보에 적합합니다.</tspan></text>
    <text x="760" y="743"><tspan x="760" dy="0">말림과 구김에 강해 이동이 잦거나</tspan><tspan x="760" dy="58">반복 사용하는 환경에 적합합니다.</tspan></text>
  </g>

  <g font-family="Pretendard,'Noto Sans KR',Arial,sans-serif" text-anchor="middle">
    <text x="2005" y="267" font-size="35" font-weight="800" fill="#172033"><tspan x="2005" dy="0">고급 이미지 · 장기간 사용</tspan><tspan x="2005" dy="56" font-size="28" font-weight="500" fill="#667085">전시 · 브랜드 홍보</tspan></text>
    <text x="2005" y="505" font-size="35" font-weight="800" fill="#172033"><tspan x="2005" dy="0">이벤트 안내 · 단기 사용</tspan><tspan x="2005" dy="56" font-size="28" font-weight="500" fill="#667085">매장 · 행사 안내</tspan></text>
    <text x="2005" y="743" font-size="35" font-weight="800" fill="#172033"><tspan x="2005" dy="0">잦은 이동 · 반복 사용</tspan><tspan x="2005" dy="56" font-size="28" font-weight="500" fill="#667085">전시회 · 순회 행사</tspan></text>
  </g>
